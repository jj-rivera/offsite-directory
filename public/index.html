<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Delhi Horizon 3 Meetup</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f0f0f;
      color: #e0e0e0;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      padding-bottom: 72px;
    }

    /* ===== BOTTOM NAV ===== */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 200;
      background: #111;
      border-top: 1px solid #222;
      display: flex;
      padding-bottom: env(safe-area-inset-bottom, 0);
    }
    .nav-tab {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 0 8px;
      gap: 3px;
      background: none;
      border: none;
      color: #666;
      font-size: 10px;
      font-weight: 500;
      cursor: pointer;
      transition: color 0.2s;
      -webkit-tap-highlight-color: transparent;
    }
    .nav-tab.active { color: #4a9eff; }
    .nav-tab svg { width: 22px; height: 22px; }

    /* ===== TAB PAGES ===== */
    .tab-page { display: none; }
    .tab-page.active { display: block; }

    /* ===== HEADER ===== */
    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: #0f0f0f;
      padding: 16px;
      border-bottom: 1px solid #222;
    }
    .header h1 {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 4px;
      text-align: center;
    }
    .header .subtitle {
      font-size: 13px;
      color: #888;
      text-align: center;
      margin-bottom: 12px;
    }
    .search-wrapper { position: relative; }
    .search-wrapper svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      color: #666;
    }
    #search {
      width: 100%;
      padding: 12px 16px 12px 42px;
      border: 1px solid #333;
      border-radius: 12px;
      background: #1a1a1a;
      color: #fff;
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s;
    }
    #search:focus { border-color: #4a9eff; }
    #search::placeholder { color: #555; }
    .count { text-align: center; font-size: 13px; color: #666; padding: 8px 16px 4px; }

    /* ===== DIRECTORY GRID ===== */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 12px;
      padding: 12px 16px 32px;
    }
    .card {
      background: #1a1a1a;
      border-radius: 16px;
      overflow: hidden;
      transition: transform 0.15s ease;
    }
    .card:active { transform: scale(0.97); }
    .card .photo-wrapper {
      width: 100%;
      aspect-ratio: 1;
      background: #252525;
      overflow: hidden;
    }
    .card .photo-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .card .placeholder-photo {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, #4a9eff, #7c3aed);
    }
    .card .info { padding: 10px 12px 12px; }
    .card .name {
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      line-height: 1.3;
      margin-bottom: 2px;
    }
    .card .title {
      font-size: 12px;
      color: #888;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card .pronunciation {
      font-size: 11px;
      color: #4a9eff;
      margin-top: 4px;
      font-style: italic;
    }

    /* New to Atlan badge */
    .new-badge {
      display: inline-block;
      padding: 2px 8px;
      background: #1a2e1a;
      border: 1px solid #2d5a2d;
      border-radius: 20px;
      color: #4ade80;
      font-size: 10px;
      font-weight: 600;
      margin-top: 4px;
      letter-spacing: 0.2px;
    }

    .coffee-btn {
      display: block;
      width: calc(100% - 24px);
      margin: 0 12px 12px;
      padding: 8px;
      background: #1e3a2f;
      border: 1px solid #2d5a45;
      border-radius: 10px;
      color: #4ade80;
      font-size: 13px;
      font-weight: 600;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.2s;
      -webkit-tap-highlight-color: transparent;
    }
    .coffee-btn:active { background: #2d5a45; }

    /* ===== LOADING / ERROR ===== */
    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 20px;
      gap: 16px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #333;
      border-top-color: #4a9eff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { color: #888; font-size: 14px; }
    .error { text-align: center; padding: 60px 20px; color: #ff6b6b; }
    .error button {
      margin-top: 16px;
      padding: 10px 24px;
      background: #4a9eff;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
    }

    /* ===== MEET SOMEONE NEW ===== */
    .meet-container {
      padding: 24px 16px;
      max-width: 420px;
      margin: 0 auto;
      text-align: center;
    }
    .meet-title {
      font-size: 24px;
      font-weight: 800;
      color: #fff;
      margin-bottom: 4px;
    }
    .meet-subtitle {
      font-size: 14px;
      color: #888;
      margin-bottom: 24px;
    }
    .meet-card {
      background: #1a1a1a;
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 20px;
    }
    .meet-photo {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      display: block;
      background: #252525;
    }
    .meet-photo-placeholder {
      width: 100%;
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 80px;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, #4a9eff, #7c3aed);
    }
    .meet-info { padding: 16px 20px 20px; }
    .meet-name {
      font-size: 24px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 4px;
    }
    .meet-role {
      font-size: 15px;
      color: #888;
      margin-bottom: 8px;
    }
    .meet-icebreaker {
      background: #111;
      border: 1px solid #2a2a2a;
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 16px;
    }
    .meet-icebreaker-label {
      font-size: 11px;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }
    .meet-icebreaker-text {
      font-size: 16px;
      color: #e0e0e0;
      font-style: italic;
      line-height: 1.4;
    }
    .meet-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .meet-coffee-btn {
      display: block;
      padding: 14px;
      background: #1e3a2f;
      border: 1px solid #2d5a45;
      border-radius: 14px;
      color: #4ade80;
      font-size: 16px;
      font-weight: 700;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.2s;
      -webkit-tap-highlight-color: transparent;
    }
    .meet-coffee-btn:active { background: #2d5a45; }
    .meet-shuffle-btn {
      padding: 14px;
      background: linear-gradient(135deg, #4a9eff, #7c3aed);
      border: none;
      border-radius: 14px;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.1s;
      -webkit-tap-highlight-color: transparent;
    }
    .meet-shuffle-btn:active { transform: scale(0.96); }
    .meet-progress {
      font-size: 12px;
      color: #555;
      margin-top: 8px;
    }
    @keyframes meetSlideIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .meet-card-anim {
      animation: meetSlideIn 0.35s ease;
    }

    /* ===== GAME TAB ===== */
    .game-container {
      padding: 20px 16px;
      max-width: 500px;
      margin: 0 auto;
      text-align: center;
    }
    .game-header {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 4px;
      color: #fff;
    }
    .game-subtitle {
      font-size: 14px;
      color: #888;
      margin-bottom: 24px;
    }

    /* Nickname prompt */
    .nickname-prompt { padding: 40px 16px; max-width: 400px; margin: 0 auto; text-align: center; }
    .nickname-prompt h2 { font-size: 28px; margin-bottom: 8px; color: #fff; }
    .nickname-prompt p { color: #888; margin-bottom: 24px; font-size: 14px; }
    .nickname-prompt input {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #333;
      border-radius: 12px;
      background: #1a1a1a;
      color: #fff;
      font-size: 18px;
      text-align: center;
      outline: none;
      margin-bottom: 16px;
    }
    .nickname-prompt input:focus { border-color: #4a9eff; }
    .nickname-prompt input::placeholder { color: #555; }

    .btn-primary {
      display: inline-block;
      padding: 14px 32px;
      background: linear-gradient(135deg, #4a9eff, #7c3aed);
      color: #fff;
      border: none;
      border-radius: 14px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-primary:active { transform: scale(0.96); }
    .btn-primary:disabled { opacity: 0.4; }

    /* Score bar */
    .score-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1a1a1a;
      border-radius: 14px;
      padding: 12px 16px;
      margin-bottom: 20px;
    }
    .score-item { text-align: center; }
    .score-label { font-size: 11px; color: #666; text-transform: uppercase; letter-spacing: 0.5px; }
    .score-value { font-size: 22px; font-weight: 800; color: #fff; }
    .score-value.streak { color: #f59e0b; }
    .score-value.points { color: #4ade80; }

    /* Question area */
    .question-progress { font-size: 13px; color: #666; margin-bottom: 16px; }
    .question-photo {
      width: 160px;
      height: 160px;
      border-radius: 20px;
      object-fit: cover;
      margin: 0 auto 20px;
      display: block;
      border: 3px solid #333;
    }
    .question-photo-placeholder {
      width: 160px;
      height: 160px;
      border-radius: 20px;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 56px;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, #4a9eff, #7c3aed);
      border: 3px solid #333;
    }
    .question-name { font-size: 22px; font-weight: 700; color: #fff; margin-bottom: 4px; }
    .question-title { font-size: 14px; color: #888; margin-bottom: 20px; }
    .question-label { font-size: 15px; color: #aaa; margin-bottom: 16px; }

    /* Answer options */
    .options { display: flex; flex-direction: column; gap: 10px; }
    .option-btn {
      width: 100%;
      padding: 14px 16px;
      background: #1a1a1a;
      border: 2px solid #333;
      border-radius: 14px;
      color: #fff;
      font-size: 16px;
      font-weight: 500;
      text-align: left;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
    }
    .option-btn:active { transform: scale(0.98); }
    .option-btn.correct { border-color: #4ade80; background: #0f2a1a; animation: popCorrect 0.4s ease; }
    .option-btn.wrong { border-color: #f87171; background: #2a0f0f; animation: popWrong 0.3s ease; }
    .option-btn.reveal { border-color: #4ade80; background: #0f2a1a; }
    .option-btn.disabled { pointer-events: none; opacity: 0.6; }

    /* Photo options grid */
    .photo-options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .photo-option {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      border: 3px solid #333;
      cursor: pointer;
      transition: border-color 0.15s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
      aspect-ratio: 1;
    }
    .photo-option:active { transform: scale(0.96); }
    .photo-option img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .photo-option .po-placeholder {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      font-size: 40px; font-weight: 700; color: #fff;
      background: linear-gradient(135deg, #4a9eff, #7c3aed);
    }
    .photo-option.correct { border-color: #4ade80; animation: popCorrect 0.4s ease; }
    .photo-option.wrong { border-color: #f87171; animation: popWrong 0.3s ease; }
    .photo-option.reveal { border-color: #4ade80; }
    .photo-option.disabled { pointer-events: none; opacity: 0.5; }
    .photo-option .po-overlay {
      position: absolute; bottom: 0; left: 0; right: 0;
      padding: 6px 8px; background: rgba(0,0,0,0.7);
      font-size: 12px; color: #fff; font-weight: 600;
      text-align: center; display: none;
    }
    .photo-option.correct .po-overlay,
    .photo-option.wrong .po-overlay,
    .photo-option.reveal .po-overlay { display: block; }

    @keyframes popCorrect {
      0% { transform: scale(1); } 30% { transform: scale(1.05); } 100% { transform: scale(1); }
    }
    @keyframes popWrong {
      0% { transform: translateX(0); } 25% { transform: translateX(-6px); }
      50% { transform: translateX(6px); } 75% { transform: translateX(-3px); } 100% { transform: translateX(0); }
    }

    /* Feedback overlay */
    .feedback {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      display: flex; align-items: center; justify-content: center;
      z-index: 300; pointer-events: none; opacity: 0; transition: opacity 0.2s;
    }
    .feedback.show { opacity: 1; }
    .feedback-emoji { font-size: 80px; animation: feedbackPop 0.5s ease; }
    @keyframes feedbackPop {
      0% { transform: scale(0); } 50% { transform: scale(1.3); } 100% { transform: scale(1); }
    }

    /* Round complete */
    .round-complete { padding: 40px 16px; text-align: center; max-width: 400px; margin: 0 auto; }
    .round-complete .big-score {
      font-size: 64px; font-weight: 800;
      background: linear-gradient(135deg, #4ade80, #4a9eff);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .round-complete .big-label { font-size: 16px; color: #888; margin-bottom: 8px; }
    .round-complete .stat-row { font-size: 18px; color: #ccc; margin: 6px 0; }
    .round-complete .stat-row span { font-weight: 700; color: #fff; }
    .round-complete .btn-row { margin-top: 28px; display: flex; flex-direction: column; gap: 12px; align-items: center; }
    .btn-secondary {
      padding: 12px 28px; background: #1a1a1a; border: 2px solid #333;
      border-radius: 14px; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer;
    }

    /* ===== LEADERBOARD ===== */
    .lb-container { padding: 20px 16px; max-width: 500px; margin: 0 auto; }
    .lb-title { font-size: 24px; font-weight: 800; text-align: center; color: #fff; margin-bottom: 4px; }
    .lb-subtitle { font-size: 14px; color: #888; text-align: center; margin-bottom: 20px; }
    .lb-empty { text-align: center; color: #666; padding: 60px 20px; font-size: 15px; }
    .lb-row {
      display: flex; align-items: center; padding: 12px 14px;
      background: #1a1a1a; border-radius: 12px; margin-bottom: 8px; gap: 12px;
    }
    .lb-row.gold { background: linear-gradient(135deg, #2a2000, #1a1a0a); border: 1px solid #d4a800; }
    .lb-row.silver { background: linear-gradient(135deg, #1e1e22, #1a1a1a); border: 1px solid #888; }
    .lb-row.bronze { background: linear-gradient(135deg, #221a10, #1a1a1a); border: 1px solid #b87333; }
    .lb-rank { font-size: 18px; font-weight: 800; width: 32px; text-align: center; flex-shrink: 0; }
    .lb-rank.r1 { color: #ffd700; }
    .lb-rank.r2 { color: #c0c0c0; }
    .lb-rank.r3 { color: #cd7f32; }
    .lb-info { flex: 1; min-width: 0; }
    .lb-name { font-size: 15px; font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .lb-stats { font-size: 12px; color: #888; }
    .lb-score { font-size: 20px; font-weight: 800; color: #4ade80; flex-shrink: 0; }
    .lb-refresh-btn {
      display: block; margin: 16px auto 0; padding: 10px 24px;
      background: #1a1a1a; border: 1px solid #333; border-radius: 10px; color: #888; font-size: 13px; cursor: pointer;
    }

    /* ===== RESPONSIVE ===== */
    @media (min-width: 400px) {
      .grid { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px; }
    }
    @media (min-width: 768px) {
      .grid { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 16px; padding: 16px 24px 40px; }
      .header { padding: 20px 24px; }
      .header h1 { font-size: 24px; }
    }
  </style>
</head>
<body>

<!-- ===== FEEDBACK OVERLAY ===== -->
<div class="feedback" id="feedback"><div class="feedback-emoji" id="feedbackEmoji"></div></div>

<!-- ===== DIRECTORY TAB ===== -->
<div class="tab-page active" id="page-directory">
  <div class="header">
    <h1>Delhi Horizon 3 Meetup</h1>
    <div class="subtitle" id="subtitle"></div>
    <div class="search-wrapper">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M11 19a8 8 0 100-16 8 8 0 000 16z"/>
      </svg>
      <input type="text" id="search" placeholder="Search by name or title..." autocomplete="off" />
    </div>
  </div>
  <div class="count" id="count"></div>
  <div id="directory-content">
    <div class="loading">
      <div class="spinner"></div>
      <div class="loading-text">Loading directory from Slack...</div>
    </div>
  </div>
</div>

<!-- ===== MEET SOMEONE NEW TAB ===== -->
<div class="tab-page" id="page-meet">
  <div class="meet-container" id="meet-root">
    <div class="loading">
      <div class="spinner"></div>
      <div class="loading-text">Loading...</div>
    </div>
  </div>
</div>

<!-- ===== GAME TAB ===== -->
<div class="tab-page" id="page-game">
  <div id="game-root"></div>
</div>

<!-- ===== LEADERBOARD TAB ===== -->
<div class="tab-page" id="page-leaderboard">
  <div class="lb-container">
    <div class="lb-title">Leaderboard</div>
    <div class="lb-subtitle">Who knows the team best?</div>
    <div id="lb-content">
      <div class="lb-empty">No scores yet. Be the first to play!</div>
    </div>
    <button class="lb-refresh-btn" onclick="loadLeaderboard()">Refresh</button>
  </div>
</div>

<!-- ===== BOTTOM NAV ===== -->
<div class="bottom-nav">
  <button class="nav-tab active" data-tab="directory" onclick="switchTab('directory')">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/>
    </svg>
    Directory
  </button>
  <button class="nav-tab" data-tab="meet" onclick="switchTab('meet')">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-3-3h-1m-6 5v-2a3 3 0 00-3-3H5a3 3 0 00-3 3v2m7-9a4 4 0 110-8 4 4 0 010 8zm8 0a3 3 0 110-6 3 3 0 010 6z"/>
    </svg>
    Meet
  </button>
  <button class="nav-tab" data-tab="game" onclick="switchTab('game')">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/>
      <path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
    </svg>
    Play
  </button>
  <button class="nav-tab" data-tab="leaderboard" onclick="switchTab('leaderboard')">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
    </svg>
    Leaderboard
  </button>
</div>

<script>
  // ===== GLOBAL STATE =====
  let allMembers = [];
  let teamId = '';
  const TWO_MONTHS_MS = 60 * 24 * 60 * 60 * 1000;

  // ===== TAB SWITCHING =====
  function switchTab(tab) {
    document.querySelectorAll('.tab-page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
    document.getElementById('page-' + tab).classList.add('active');
    document.querySelector('[data-tab="' + tab + '"]').classList.add('active');
    if (tab === 'meet' && allMembers.length > 0) renderMeet();
    if (tab === 'game' && allMembers.length > 0) initGame();
    if (tab === 'leaderboard') loadLeaderboard();
  }

  // ===== UTILITY =====
  function escapeHtml(str) {
    var d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }
  function getInitials(name) {
    return name.split(' ').map(function(w) { return w[0]; }).filter(Boolean).slice(0, 2).join('').toUpperCase();
  }
  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function isNewToAtlan(member) {
    if (!member.startDate) return false;
    var now = Date.now();
    var startTs = new Date(member.startDate + 'T00:00:00').getTime();
    return (now - startTs) < TWO_MONTHS_MS;
  }
  function newBadgeHtml(member) {
    return isNewToAtlan(member) ? '<span class="new-badge">&#x1F195; New to Atlan</span>' : '';
  }

  // ===== LOAD MEMBERS =====
  async function loadMembers() {
    try {
      var res = await fetch('/api/members');
      if (!res.ok) throw new Error('Failed to fetch');
      var data = await res.json();
      allMembers = data.members;
      teamId = data.teamId || '';
      document.getElementById('subtitle').textContent =
        allMembers.length + ' people' + (data.cached ? ' (cached)' : '');
      renderMembers(allMembers);
    } catch (err) {
      document.getElementById('directory-content').innerHTML =
        '<div class="error"><p>Could not load directory.</p>' +
        '<p style="font-size:13px;color:#999;margin-top:8px">' + escapeHtml(err.message) + '</p>' +
        '<button onclick="location.reload()">Retry</button></div>';
    }
  }

  // ===== RENDER DIRECTORY =====
  function renderMembers(members) {
    document.getElementById('count').textContent =
      members.length === allMembers.length ? '' : 'Showing ' + members.length + ' of ' + allMembers.length;

    var html = members.map(function(m) {
      var photoHtml = m.photo
        ? '<img src="' + escapeHtml(m.photo) + '" alt="' + escapeHtml(m.name) + '" loading="lazy" />'
        : '<div class="placeholder-photo">' + getInitials(m.name) + '</div>';
      var titleHtml = m.title ? '<div class="title">' + escapeHtml(m.title) + '</div>' : '';
      var pronHtml = m.pronunciation ? '<div class="pronunciation">' + escapeHtml(m.pronunciation) + '</div>' : '';
      var badge = newBadgeHtml(m);

      var coffeeHtml = '';
      if (teamId && m.id) {
        var slackUrl = 'slack://user?team=' + encodeURIComponent(teamId) + '&id=' + encodeURIComponent(m.id);
        coffeeHtml = '<a class="coffee-btn" href="' + slackUrl + '">&#9749; Coffee Chat</a>';
      }

      return '<div class="card">' +
        '<div class="photo-wrapper">' + photoHtml + '</div>' +
        '<div class="info">' +
          '<div class="name">' + escapeHtml(m.name) + '</div>' +
          titleHtml + pronHtml + badge +
        '</div>' +
        coffeeHtml +
        '</div>';
    }).join('');

    document.getElementById('directory-content').innerHTML = '<div class="grid">' + html + '</div>';
  }

  // Search
  var searchTimeout;
  document.getElementById('search').addEventListener('input', function(e) {
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(function() {
      var q = e.target.value.toLowerCase().trim();
      if (!q) { renderMembers(allMembers); return; }
      renderMembers(allMembers.filter(function(m) {
        return m.name.toLowerCase().includes(q) || (m.title && m.title.toLowerCase().includes(q));
      }));
    }, 150);
  });

  // ===== MEET SOMEONE NEW =====
  var meetSeen = [];
  var meetShuffled = [];
  var meetIndex = 0;

  var icebreakers = [
    "What's been the highlight of the offsite so far?",
    "What's something most people don't know about you?",
    "What are you most excited to work on this year?",
    "What's your go-to lunch order?",
    "What did you do before Atlan?",
    "What's a hobby you picked up recently?",
    "What's the best advice you've ever received?",
    "If you weren't in tech, what would you be doing?",
    "What's on your bucket list?",
    "What's the last great book or show you binged?",
    "What's your hot take that no one agrees with?",
    "If you could have dinner with anyone, who would it be?",
    "What's the most adventurous thing you've done?",
    "What's your comfort food?",
    "What's a skill you'd love to learn?",
  ];

  function initMeetPool() {
    meetShuffled = shuffle(allMembers);
    meetIndex = 0;
  }

  function getNextMeetPerson() {
    if (meetShuffled.length === 0) initMeetPool();
    if (meetIndex >= meetShuffled.length) {
      // Cycled through everyone, reshuffle
      meetShuffled = shuffle(allMembers);
      meetIndex = 0;
    }
    var person = meetShuffled[meetIndex];
    meetIndex++;
    return person;
  }

  function renderMeet() {
    if (meetShuffled.length === 0) initMeetPool();
    var m = getNextMeetPerson();
    var ice = icebreakers[Math.floor(Math.random() * icebreakers.length)];
    var root = document.getElementById('meet-root');

    var photoHtml = m.photo
      ? '<img class="meet-photo" src="' + escapeHtml(m.photo) + '" />'
      : '<div class="meet-photo-placeholder">' + getInitials(m.name) + '</div>';

    var badge = newBadgeHtml(m);
    var coffeeHtml = '';
    if (teamId && m.id) {
      var slackUrl = 'slack://user?team=' + encodeURIComponent(teamId) + '&id=' + encodeURIComponent(m.id);
      coffeeHtml = '<a class="meet-coffee-btn" href="' + slackUrl + '">&#9749; Send them a Coffee Chat message</a>';
    }

    var met = meetIndex;
    var total = allMembers.length;

    root.innerHTML =
      '<div class="meet-title">Meet Someone New</div>' +
      '<div class="meet-subtitle">Go say hi! &#x1F44B;</div>' +
      '<div class="meet-card meet-card-anim">' +
        photoHtml +
        '<div class="meet-info">' +
          '<div class="meet-name">' + escapeHtml(m.name) + '</div>' +
          '<div class="meet-role">' + escapeHtml(m.title || 'Team Member') + '</div>' +
          badge +
        '</div>' +
      '</div>' +
      '<div class="meet-icebreaker">' +
        '<div class="meet-icebreaker-label">&#x1F4AC; Icebreaker</div>' +
        '<div class="meet-icebreaker-text">"' + escapeHtml(ice) + '"</div>' +
      '</div>' +
      '<div class="meet-actions">' +
        coffeeHtml +
        '<button class="meet-shuffle-btn" onclick="renderMeet()">&#x1F500; Shuffle &mdash; Meet someone else</button>' +
      '</div>' +
      '<div class="meet-progress">Met ' + Math.min(met, total) + ' of ' + total + ' people this session</div>';
  }

  // ===== GAME LOGIC =====
  var gameState = null;

  function initGame() {
    var root = document.getElementById('game-root');
    if (!gameState || gameState.phase === 'done') {
      var savedNick = localStorage.getItem('offsite_nickname') || '';
      root.innerHTML =
        '<div class="nickname-prompt">' +
          '<h2>Who\'s Who? &#x1F3AF;</h2>' +
          '<p>Test how well you know your teammates!</p>' +
          '<p style="color:#666;font-size:13px">10 questions per round</p>' +
          '<input type="text" id="nickname-input" placeholder="Your nickname" maxlength="20" value="' + escapeHtml(savedNick) + '" />' +
          '<br><button class="btn-primary" onclick="startGame()" id="start-btn">Let\'s Go!</button>' +
        '</div>';
      var inp = document.getElementById('nickname-input');
      inp.addEventListener('keydown', function(e) { if (e.key === 'Enter') startGame(); });
    }
  }

  function startGame() {
    var inp = document.getElementById('nickname-input');
    var nick = (inp ? inp.value.trim() : '') || 'Anonymous';
    localStorage.setItem('offsite_nickname', nick);

    var questions = [];
    var membersWithPhotos = allMembers.filter(function(m) { return m.photo; });
    var pool = membersWithPhotos.length >= 10 ? membersWithPhotos : allMembers;
    var chosen = shuffle(pool).slice(0, 10);

    for (var i = 0; i < chosen.length; i++) {
      var mode = (membersWithPhotos.length >= 4 && Math.random() < 0.5) ? 'photo' : 'name';
      var correct = chosen[i];
      var wrongs = [];
      var used = {};
      used[correct.id] = true;
      while (wrongs.length < 3) {
        var r = pool[Math.floor(Math.random() * pool.length)];
        if (!used[r.id]) {
          wrongs.push(r);
          used[r.id] = true;
        }
      }
      var options = shuffle([correct].concat(wrongs));
      questions.push({ mode: mode, correct: correct, options: options });
    }

    gameState = {
      nickname: nick,
      questions: questions,
      current: 0,
      score: 0,
      streak: 0,
      bestStreak: 0,
      correctCount: 0,
      phase: 'playing',
      answered: false,
    };

    renderQuestion();
  }

  function renderQuestion() {
    var gs = gameState;
    var q = gs.questions[gs.current];
    var root = document.getElementById('game-root');

    var scoreBar =
      '<div class="score-bar">' +
        '<div class="score-item"><div class="score-label">Score</div><div class="score-value points">' + gs.score + '</div></div>' +
        '<div class="score-item"><div class="score-label">Streak</div><div class="score-value streak">' + (gs.streak > 0 ? '&#x1F525; ' + gs.streak : '0') + '</div></div>' +
        '<div class="score-item"><div class="score-label">Q</div><div class="score-value">' + (gs.current + 1) + '/10</div></div>' +
      '</div>';

    var questionHtml = '';

    if (q.mode === 'photo') {
      var photoEl = q.correct.photo
        ? '<img class="question-photo" src="' + escapeHtml(q.correct.photo) + '" />'
        : '<div class="question-photo-placeholder">' + getInitials(q.correct.name) + '</div>';
      var optsHtml = q.options.map(function(o, idx) {
        return '<button class="option-btn" data-idx="' + idx + '" onclick="answerName(' + idx + ')">' +
          escapeHtml(o.name) +
          (o.title ? ' <span style="color:#666;font-size:13px">&mdash; ' + escapeHtml(o.title) + '</span>' : '') +
          '</button>';
      }).join('');
      questionHtml =
        '<div class="question-label">Who is this?</div>' +
        photoEl +
        '<div class="options">' + optsHtml + '</div>';
    } else {
      var optsHtml2 = q.options.map(function(o, idx) {
        var inner = o.photo
          ? '<img src="' + escapeHtml(o.photo) + '" />'
          : '<div class="po-placeholder">' + getInitials(o.name) + '</div>';
        return '<div class="photo-option" data-idx="' + idx + '" onclick="answerPhoto(' + idx + ')">' +
          inner +
          '<div class="po-overlay">' + escapeHtml(o.name) + '</div>' +
          '</div>';
      }).join('');
      questionHtml =
        '<div class="question-label">Find their photo &#x1F447;</div>' +
        '<div class="question-name">' + escapeHtml(q.correct.name) + '</div>' +
        '<div class="question-title">' + escapeHtml(q.correct.title || '') + '</div>' +
        '<div class="photo-options">' + optsHtml2 + '</div>';
    }

    root.innerHTML = '<div class="game-container">' + scoreBar + questionHtml + '</div>';
  }

  function answerName(idx) {
    if (gameState.answered) return;
    gameState.answered = true;
    var q = gameState.questions[gameState.current];
    processAnswer(q.options[idx].id === q.correct.id, idx, 'name');
  }

  function answerPhoto(idx) {
    if (gameState.answered) return;
    gameState.answered = true;
    var q = gameState.questions[gameState.current];
    processAnswer(q.options[idx].id === q.correct.id, idx, 'photo');
  }

  function processAnswer(isCorrect, chosenIdx, mode) {
    var gs = gameState;
    var q = gs.questions[gs.current];
    var correctIdx = -1;
    for (var ci = 0; ci < q.options.length; ci++) {
      if (q.options[ci].id === q.correct.id) { correctIdx = ci; break; }
    }

    if (isCorrect) {
      gs.streak++;
      if (gs.streak > gs.bestStreak) gs.bestStreak = gs.streak;
      gs.score += 10 + (gs.streak > 1 ? (gs.streak - 1) * 5 : 0);
      gs.correctCount++;
    } else {
      gs.streak = 0;
    }

    var selector = mode === 'photo' ? '.photo-option' : '.option-btn';
    var els = document.querySelectorAll(selector);
    els.forEach(function(el, i) {
      if (i === chosenIdx && isCorrect) el.classList.add('correct');
      else if (i === chosenIdx && !isCorrect) el.classList.add('wrong');
      else if (i === correctIdx && !isCorrect) el.classList.add('reveal');
      if (i !== chosenIdx && i !== correctIdx) el.classList.add('disabled');
    });

    showFeedback(isCorrect);
    document.querySelector('.score-value.points').textContent = gs.score;
    document.querySelector('.score-value.streak').textContent = gs.streak > 0 ? '&#x1F525; ' + gs.streak : '0';

    setTimeout(function() {
      gs.current++;
      gs.answered = false;
      if (gs.current >= 10) endRound();
      else renderQuestion();
    }, isCorrect ? 1000 : 1800);
  }

  function showFeedback(isCorrect) {
    var fb = document.getElementById('feedback');
    var em = document.getElementById('feedbackEmoji');
    var good = ['\u{1F389}', '\u{1F4AA}', '\u{1F525}', '\u2B50', '\u{1F64C}', '\u{1F44F}', '\u2705'];
    var bad = ['\u{1F605}', '\u274C', '\u{1F914}', '\u{1F480}', '\u{1F62C}'];
    var arr = isCorrect ? good : bad;
    em.textContent = arr[Math.floor(Math.random() * arr.length)];
    fb.classList.add('show');
    setTimeout(function() { fb.classList.remove('show'); }, 700);
  }

  async function endRound() {
    var gs = gameState;
    gs.phase = 'done';

    try {
      await fetch('/api/leaderboard', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          nickname: gs.nickname,
          score: gs.score,
          correct: gs.correctCount,
          total: 10,
        }),
      });
    } catch (e) { /* ignore */ }

    var pct = Math.round((gs.correctCount / 10) * 100);
    var verdict = '';
    if (pct === 100) verdict = '\u{1F3C6} PERFECT SCORE!';
    else if (pct >= 80) verdict = '\u{1F31F} Amazing!';
    else if (pct >= 60) verdict = '\u{1F44F} Nice work!';
    else if (pct >= 40) verdict = '\u{1F60A} Getting there!';
    else verdict = '\u{1F4AA} Keep learning!';

    document.getElementById('game-root').innerHTML =
      '<div class="round-complete">' +
        '<div style="font-size:48px;margin-bottom:12px">' + verdict.split(' ')[0] + '</div>' +
        '<div class="big-label">Final Score</div>' +
        '<div class="big-score">' + gs.score + '</div>' +
        '<div class="stat-row"><span>' + gs.correctCount + '</span> / 10 correct (' + pct + '%)</div>' +
        '<div class="stat-row">Best streak: <span>&#x1F525; ' + gs.bestStreak + '</span></div>' +
        '<div style="font-size:18px;color:#aaa;margin-top:8px">' + verdict + '</div>' +
        '<div class="btn-row">' +
          '<button class="btn-primary" onclick="startGame()">Play Again &#x1F3AF;</button>' +
          '<button class="btn-secondary" onclick="switchTab(\'leaderboard\')">View Leaderboard</button>' +
        '</div>' +
      '</div>';
  }

  // ===== LEADERBOARD =====
  async function loadLeaderboard() {
    try {
      var res = await fetch('/api/leaderboard');
      var data = await res.json();
      renderLeaderboard(data.leaderboard);
    } catch (e) { /* ignore */ }
  }

  function renderLeaderboard(entries) {
    var el = document.getElementById('lb-content');
    if (!entries || entries.length === 0) {
      el.innerHTML = '<div class="lb-empty">No scores yet. Be the first to play! &#x1F3AF;</div>';
      return;
    }
    var medals = ['\u{1F947}', '\u{1F948}', '\u{1F949}'];
    var rowClasses = ['gold', 'silver', 'bronze'];
    el.innerHTML = entries.map(function(e, i) {
      var cls = i < 3 ? ' ' + rowClasses[i] : '';
      var rankCls = i < 3 ? ' r' + (i + 1) : '';
      var rank = i < 3 ? medals[i] : (i + 1);
      return '<div class="lb-row' + cls + '">' +
        '<div class="lb-rank' + rankCls + '">' + rank + '</div>' +
        '<div class="lb-info">' +
          '<div class="lb-name">' + escapeHtml(e.nickname) + '</div>' +
          '<div class="lb-stats">' + e.correct + '/' + e.total + ' correct</div>' +
        '</div>' +
        '<div class="lb-score">' + e.score + '</div>' +
      '</div>';
    }).join('');
  }

  // ===== INIT =====
  loadMembers();
</script>
</body>
</html>
